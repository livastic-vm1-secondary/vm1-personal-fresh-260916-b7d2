merge_queue:
  max_parallel_checks: 1

conflict_resolvers:
  - paths:
      - vm1-crjson-reorder-policy.json
    strategy: json

queue_rules:
  - name: vm1-crjson-reorder-261006
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 1 minute
    queue_conditions:
      - base = vm1-crjson-reorder-base-261006
      - title ~= ^VM1_CRJSON_REORDER_[AB]_261006$
    merge_conditions:
      - check-success = vm1-crjson-reorder-never
